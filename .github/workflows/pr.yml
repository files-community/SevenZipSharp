on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev", "master" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Desktop]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Execute unit tests
      run: dotnet test -c $env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Publish NativeAOT smoke test
      run: dotnet publish TestApp/TestApp.csproj -c Desktop -r win-x64 --self-contained true -o artifacts/aot

    - name: Execute NativeAOT smoke test
      run: artifacts/aot/TestApp.exe
